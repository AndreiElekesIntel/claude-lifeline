# Runs on Windows because that is what this app targets — the tray, the
# autostart task, and the shutdown check are all Windows-specific, and a
# Linux runner would pass while telling you nothing about the product.
#
# The e2e suite drives the real Electron app, which needs a display. Windows
# runners have one, so no xvfb dance is required.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e

      # The screenshots in the README are generated by a spec, so a UI change
      # that breaks the capture is a broken README. Cheap to catch here.
      - name: Screenshots still capture
        run: npm run screenshots

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
